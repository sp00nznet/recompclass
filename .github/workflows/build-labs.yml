name: Build Labs

on:
  push:
    paths:
      - 'labs/**'
  pull_request:
    paths:
      - 'labs/**'

jobs:
  build-c-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cmake libsdl2-dev

      - name: Build C labs
        run: |
          for dir in labs/lab-*/; do
            if [ -f "$dir/Makefile" ]; then
              echo "Building $dir..."
              make -C "$dir" || exit 1
            elif [ -f "$dir/CMakeLists.txt" ]; then
              echo "Building $dir with CMake..."
              cmake -B "$dir/build" -S "$dir" && cmake --build "$dir/build" || exit 1
            fi
          done

  test-python-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install capstone pefile pytest

      # The lab sources are deliberately TODO stubs, so their tests are SUPPOSED to
      # fail until a student fills them in. CI therefore gates on the two things that
      # are always meant to hold: every lab module imports, and every test file can be
      # collected. Running `python test_lab.py` (as this job used to) executed nothing
      # at all and passed unconditionally.
      - name: Check every lab module imports
        run: |
          python - <<'EOF'
          import importlib.util, pathlib, sys
          bad = []
          for f in sorted(pathlib.Path("labs").glob("lab-*/*.py")):
              if f.name == "test_lab.py":
                  continue
              sys.path.insert(0, str(f.parent))
              spec = importlib.util.spec_from_file_location(f"{f.parent.name}_{f.stem}", f)
              mod = importlib.util.module_from_spec(spec)
              try:
                  spec.loader.exec_module(mod)
              except Exception as e:
                  bad.append(f"{f}: {type(e).__name__}: {e}")
              finally:
                  sys.path.pop(0)
                  sys.modules.pop(spec.name, None)
          for b in bad:
              print("BROKEN:", b)
          sys.exit(1 if bad else 0)
          EOF

      # One pytest process per lab: each lab directory owns its own module namespace,
      # and several labs share file names (simple_isa.py), so a single run would
      # collide on basenames.
      - name: Check every lab test file collects
        run: |
          status=0
          for dir in labs/lab-*/; do
            if [ -f "$dir/test_lab.py" ]; then
              if ! python -m pytest "$dir" --collect-only -q > /dev/null 2>&1; then
                echo "BROKEN: $dir does not collect"
                python -m pytest "$dir" --collect-only -q 2>&1 | grep -E '^E ' | head -3
                status=1
              fi
            fi
          done
          exit $status

  validate-mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Validate Mermaid diagrams
        run: |
          # Extract and validate all Mermaid blocks from markdown files
          find . -name "*.md" -exec grep -l '```mermaid' {} \; | while read file; do
            echo "Validating Mermaid in $file..."
            python3 -c "
          import re, sys, subprocess, tempfile, os
          with open('$file') as f:
              content = f.read()
          blocks = re.findall(r'\`\`\`mermaid\n(.*?)\`\`\`', content, re.DOTALL)
          for i, block in enumerate(blocks):
              tmp = tempfile.NamedTemporaryFile(suffix='.mmd', delete=False, mode='w')
              tmp.write(block)
              tmp.close()
              result = subprocess.run(['mmdc', '-i', tmp.name, '-o', '/dev/null'], capture_output=True)
              os.unlink(tmp.name)
              if result.returncode != 0:
                  print(f'FAIL: Block {i+1} in $file')
                  print(result.stderr.decode())
                  sys.exit(1)
          print(f'  {len(blocks)} diagram(s) OK')
          "
          done
