name: Build Labs

# No path filter. The gates below depend on tools/ and on markdown outside labs/,
# so filtering on 'labs/**' meant a change to tools/make_solutions.py -- the thing
# that generates every reference solution -- skipped all of them.
on: [push, pull_request]

jobs:
  build-c-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cmake libsdl2-dev

      # Two labs cannot build as shipped, because the thing CI would build is the
      # exercise: lab-06's Makefile needs output.c, which the student generates by
      # running mini_recomp.py, and lab-30's CMakeLists.txt is a set of TODOs with
      # no project() command -- writing it *is* the lab. Building them here would
      # mean a permanently red job, which trains everyone to ignore the result.
      - name: Build C labs
        run: |
          SKIP="lab-06 lab-30"
          status=0
          for dir in labs/lab-*/; do
            name=$(basename "$dir")
            case " $SKIP " in
              *" $name "*) echo "skipping $name (its build output is the exercise)"; continue ;;
            esac
            if [ -f "$dir/Makefile" ]; then
              echo "Building $name..."
              make -C "$dir" || status=1
            elif [ -f "$dir/CMakeLists.txt" ]; then
              echo "Building $name with CMake..."
              cmake -B "$dir/build" -S "$dir" && cmake --build "$dir/build" || status=1
            fi
          done
          exit $status

  test-python-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install capstone pefile pytest

      # The lab sources are deliberately TODO stubs, so their tests are SUPPOSED to
      # fail until a student fills them in. CI therefore gates on the two things that
      # are always meant to hold: every lab module imports, and every test file can be
      # collected. Running `python test_lab.py` (as this job used to) executed nothing
      # at all and passed unconditionally.
      - name: Check every lab module imports
        run: |
          python - <<'EOF'
          import importlib.util, pathlib, sys
          bad = []
          for f in sorted(pathlib.Path("labs").glob("lab-*/*.py")):
              if f.name == "test_lab.py":
                  continue
              sys.path.insert(0, str(f.parent))
              spec = importlib.util.spec_from_file_location(f"{f.parent.name}_{f.stem}", f)
              mod = importlib.util.module_from_spec(spec)
              try:
                  spec.loader.exec_module(mod)
              except Exception as e:
                  bad.append(f"{f}: {type(e).__name__}: {e}")
              finally:
                  sys.path.pop(0)
                  sys.modules.pop(spec.name, None)
          for b in bad:
              print("BROKEN:", b)
          sys.exit(1 if bad else 0)
          EOF

      # The reference solutions are generated from the stubs, so a stub that
      # changes shape must be followed by regenerating. This catches drift.
      - name: Check reference solutions are current
        run: python tools/make_solutions.py --check

      # The real gate: every reference solution must pass its own lab's tests.
      # The stubs are meant to fail (they are TODOs); the solutions are not.
      - name: Run lab tests against the reference solutions
        run: python tools/check_solutions.py

      # One pytest process per lab: each lab directory owns its own module namespace,
      # and several labs share file names (simple_isa.py), so a single run would
      # collide on basenames.
      - name: Check every lab test file collects
        run: |
          status=0
          for dir in labs/lab-*/; do
            if [ -f "$dir/test_lab.py" ]; then
              if ! python -m pytest "$dir" --collect-only -q > /dev/null 2>&1; then
                echo "BROKEN: $dir does not collect"
                python -m pytest "$dir" --collect-only -q 2>&1 | grep -E '^E ' | head -3
                status=1
              fi
            fi
          done
          exit $status

  validate-mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      # One python process over every file. The old version piped `find` into a
      # `while read` loop, so the job's exit status was whichever file happened to
      # be validated last -- a failure in any earlier file went green. It was also
      # gated on `paths: labs/**`, and 34 of the 35 files with diagrams live
      # outside labs/, so in practice it validated almost nothing.
      - name: Validate Mermaid diagrams
        run: |
          python3 - <<'EOF'
          import os, pathlib, re, subprocess, sys, tempfile
          # Anchored to line starts: one lecture contains Python that *emits*
          # a mermaid fence as a string literal, and an unanchored pattern
          # matches that source as if it were a diagram.
          FENCE = re.compile(r"^```mermaid$(.*?)^```$", re.DOTALL | re.MULTILINE)
          failures, checked, files = [], 0, 0
          for md in sorted(pathlib.Path(".").rglob("*.md")):
              if ".git" in md.parts:
                  continue
              files += 1
              text = md.read_text(encoding="utf-8", errors="replace")
              for i, block in enumerate(FENCE.findall(text), 1):
                  checked += 1
                  tmp = tempfile.NamedTemporaryFile(suffix=".mmd", delete=False,
                                                    mode="w", encoding="utf-8")
                  tmp.write(block.strip())
                  tmp.close()
                  r = subprocess.run(["mmdc", "-i", tmp.name, "-o", os.devnull],
                                     capture_output=True)
                  os.unlink(tmp.name)
                  if r.returncode != 0:
                      err = r.stderr.decode(errors="replace").strip()
                      failures.append(f"{md}: block {i} -- {err}")
          print(f"checked {checked} diagram(s) across {files} markdown file(s)")
          for f in failures:
              print("FAIL:", f)
          sys.exit(1 if failures else 0)
          EOF
